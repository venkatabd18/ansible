- name: print the variables from task
  hosts: node
  vars:
    course: DevOps
    duration: 120day
  tasks:
  - name: print the info
    ansible.builtin.debug:
      msg: "I am learing {{ course }} and duration is {{ duration }}"

  - name: print the info using task vars
    vars:
      course: ansible
      duration: 6day
    ansible.builtin.debug:
      msg: "I am learing {{ course }} and duration is {{ duration }}"