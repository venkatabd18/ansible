- name: print the info using prompt vars
  hosts: node
  vars_prompt:
    - name: course
      prompt: pls enter the course name
      private: false
    - name: duration
      prompt: pls enter the duration
      private: false
  tasks:
  - name: print the info
    ansible.builtin.debug:
      msg: "i am learing {{ course }} and duration is {{ duration}}"