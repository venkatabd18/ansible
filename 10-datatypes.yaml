- name: printing data types
  hosts: local
  connection: local
  vars:
    COURSE: DevOps wit AWS
    DURATION: 5 months
    topics:
      - Linux
      - shell
      - ansible
    live: true
    tools:
      ci: jenkin
      cm: ansible
      cloud: AWS
  tasks:
  - name: print the info
    ansible.builtin.debug:
      msg: "Hi, I am learning {{ COURSE }}, with duration: {{ DURATION }}, topics are: {{ topics }}, and live: {{ live }}, tools are: {{ tools }}"