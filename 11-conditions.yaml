- name: create expense user when it is not availbe
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: check user exist or not
    ansible.builtin.command: id expense
    register: user_info
    ignore_errors: true

  - name: print the user info
    ansible.builtin.debug:
      msg: "{{ user_info }}"
  
  - name: create expense user
    ansible.builtin.user:
      name: expense
      state: present
    when: {user_info | rc != 0}