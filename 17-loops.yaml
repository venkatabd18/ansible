- name: install packages and unistall unwantaded packages
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install required package and uninstall unwantaded packages
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
      - { name: 'nginx', state: 'present' }
      - { name: 'mysql', state: 'present'}
      - { name: 'postfix', state: 'absent'}