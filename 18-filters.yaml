- name: demo on filres / functions
  hosts: local
  connection: local
  tasks:
  - name: print default variable
    ansible.builtin.debug:
      msg: "i am learing {{ COURSE | default('ansible')}}"

  - name: conver uppercase
    vars:
      greeting: "Hello Venkat"         
    ansible.builtin.debug:
      msg: "{{ greeting | upper }}"

  - name: print in lower case
    vars:
      greeting: "Hello Venkat"         
    ansible.builtin.debug:
      msg: "{{ greeting | lower }}"

  - name: get the unique value
    vars: 
      numbers: [ 1,4,3,2,1,4,5,3]
    ansible.builtin.debug:
      msg: "{{ numbers | unique }}"

  - name: print the max value
    vars: 
      numbers: [ 1,4,3,2,1,4,5,3]
    ansible.builtin.debug:
      msg: "{{ numbers | max }}"
      