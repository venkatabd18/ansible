- name: demo on filres / functions
  hosts: local
  connection: local
  tasks:
  - name: print default variable
    ansible.builtin.debug:
      msg: "i am learing {{ COURSE | default('ansible')}}"

  - name: conver uppercase
    vars:
      greeting: "Hello Venkat"         
    ansible.builtin.debug:
      msg: "{{ greeting | upper }}"

  - name: print in lower case
    vars:
      greeting: "Hello Venkat"         
    ansible.builtin.debug:
      msg: "{{ greeting | lower }}"

  - name: get the unique value
    vars: 
      numbers: [ 1,4,3,2,1,4,5,3]
    ansible.builtin.debug:
      msg: "{{ numbers | unique }}"

  - name: print the max value
    vars: 
      numbers: [ 1,4,3,2,1,4,5,3]
    ansible.builtin.debug:
      msg: "{{ numbers | max }}"
      
  - name: print the min value
    vars: 
      numbers: [ 1,4,3,2,1,4,5,3]
    ansible.builtin.debug:
      msg: "{{ numbers | min }}"

  - name: convert map to list
    vars:
      COURSE:
        name: DevOps with AWS
        duration: 129hrs
    ansible.builtin.debug:
      msg: "{{ COURSE | dict2items }}"

  - name: convert list to map
    vars:
      COURSE:
        - {"key": "name", "value": "DevOps with AWS"}
        - {"key": "duration", "value": "129hrs"}
    ansible.builtin.debug:
      msg: "{{ COURSE | items2dict }}"
