- name: create 3 ec2 instances and r53 records
  hosts: local
  connection: local
  become: yes
  vars:
    instances:
      - mysql
      - backend
      - frontend
    
    
  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      executable: pip3.9
    loop:
      - boto3
      - botocore

  



  