- name: create 3 ec2 instances and r53 records
  hosts: local
  connection: local
  become: yes
  vars:
    instances:
      - mysql
      - backend
      - frontend
    
    
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: "t3.micro"
      vpc_subnet_id: "subnet-0e6a100cffe49897b"
      state: "present"
      security_group: "sg-03891f88ae315b0c9"
      image_id: "ami-0220d79f3f480ecf5"
    loop: "{{ instances }}"



  