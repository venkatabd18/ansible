- name: create ec2 instance
  hosts: local
  connection: local
  become: yes
  vars:
    subnet_id: "subnet-0e6a100cffe49897b"
    image_id: "ami-0220d79f3f480ecf5"
    sg_id: "sg-03891f88ae315b0c9"
    region: "us-east-1"
  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      state: present
      executable: pip3.9
    loop:
      - boto3
      - botocore

  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "Linux-server"
      vpc_subnet_id: "{{ subnet_id }}"
      instance_type: "t3.micro"
      image_id: "{{ image_id }}"
      security_group: "{{ sg_id }}"
      region: "{{ region }}"     
