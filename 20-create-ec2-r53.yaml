- name: create 3 ec2 instances and r53 records
  hosts: local
  connection: local
  become: yes
  vars:
    subnet_id: "subnet-0e6a100cffe49897b"
    sg_id: "sg-03891f88ae315b0c9"
    instance_type: "t3.micro"
    image_id: "ami-0220d79f3f480ecf5"
    zone_id: "venra.online"
    instances:
      - mysql
      - backend
      - frontend

  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      state: "present"
      executable: pip3.9
    loop:
      - boto3
      - botocore

  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      vpc_subnet_id: "{{ subnet_id }}"
      instance_type: "{{ instance_type }}"
      security_group: "{{ sg_id}}"
      image_id: "{{ image_id}}"
      region: "us-east-1"
    loop: "{{ instances }}"
    register: ec2_info

  - name: print ec2 info
    ansible.builtin.debug:
      msg: "{{ ec2_info }}"

  - name: create private r53 records
    amazon.aws.route53:
      state: "present"
      zone: "{{ zone_id }}"
      record: "{{ item.item }}.{{ zone_id }}"
      value: "{{ item.instances[0].private_ip_address }}"
      type: A
      ttl: 1
      wait: true
      overwrite: true
    loop: "{{ ec2_info.results }}"

  - name: create public r53 record
    amazon.aws.route53:
      state: "present"
      zone: "{{ zone_id }}"
      record: "{{ zone_id }}"
      value: "{{ item.instances[0].public_ip_address }}"
      type: A 
      ttl: 1
      wait: true
      overwrite: true
    loop: "{{ ec2_info.results }}"
    when: item.item == frontend


    
  