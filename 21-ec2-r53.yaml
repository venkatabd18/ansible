- name: create 3 ec2 instances 3 private and one public r53 record
  hosts: local
  connection: local
  become: yes
  vars:
    subnet_id: "subnet-0e6a100cffe49897b"
    sg_id: "sg-03891f88ae315b0c9"
    image_id: "ami-0220d79f3f480ecf5"
    region: "us-east-1"
    instances:
      - mysql
      - backend
      - frontend
  
  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      state: "present"
    loop:
      - boto3
      - botocore

  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      vpc_subnet_id: "{{ subnet_id }}"
      security_group: "{{ sg_id }}"
      image_id: "{{ image_id }}"
      region: "{{ region }}"
      instance_type: t3.micro
      wait: true
    loop: "{{ instances }}"
    register: ec2_info

  - name: print the instances info
    ansible.builtin.debug:
      msg: "{{ ec2_info }}"