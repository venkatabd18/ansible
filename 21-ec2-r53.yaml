- name: create 3 ec2 instances 3 private and one public r53 record
  hosts: local
  connection: local
  become: yes
  vars:
    subnet_id: "subnet-0e6a100cffe49897b"
    sg_id: "sg-03891f88ae315b0c9"
    image_id: "ami-0220d79f3f480ecf5"
    region: "us-east-1"
    zone: venra.online
    instances:
      - mysql
      - backend
      - frontend
  
  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      state: "present"
    loop:
      - boto3
      - botocore

  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      vpc_subnet_id: "{{ subnet_id }}"
      security_group: "{{ sg_id }}"
      image_id: "{{ image_id }}"
      region: "{{ region }}"
      instance_type: t3.micro
      wait: true
    loop: "{{ instances }}"
    register: ec2_info

  - name: print the instances info
    ansible.builtin.debug:
      msg: "{{ ec2_info }}"

  - name: create private r53 records
    amazon.aws.route53:
      state: "present"
      zone: "{{ zone }}"
      record: "{{ item.item }}.{{ zone }}"
      value: "{{ item.instances[0].private_ip_address }}"
      type: A
      ttl: 1
      overwrite: true
    loop: "{{ ec2_info.results }}"

  - name: create punlic r53 record
    amazon.aws.route53:
      state: "present"
      zone: "{{ zone }}"
      record: "{{ zone }}"
      value: "{{ item.instances[0].public_ip_address }}"
      type: A 
      ttl: 1
      overwrite: true
      wait: true
    loop: "{{ ec2_info.results}}"
    when: item.item == "frontend"
